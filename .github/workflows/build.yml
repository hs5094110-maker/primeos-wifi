name: Build rtl8188fu for PrimeOS 4.14.15
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev wget xz-utils git gcc-multilib
      - name: Download Kernel 4.14.15 & Driver
        run: |
          wget https://mirrors.edge.kernel.org/pub/linux/kernel/v4.x/linux-4.14.15.tar.xz
          tar -xf linux-4.14.15.tar.xz
          git clone https://github.com/kelebek333/rtl8188fu.git
      - name: Prepare 32-bit Kernel
        run: |
          cd linux-4.14.15
          sed -i 's/EXTRAVERSION =.*/EXTRAVERSION = -primeos-x86/' Makefile
          make ARCH=i386 defconfig
          make ARCH=i386 modules_prepare
      - name: Compile Driver
        run: |
          cd rtl8188fu
          make ARCH=i386 KSRC=../linux-4.14.15
      - name: Upload Driver & Firmware
        uses: actions/upload-artifact@v4
        with:
          name: rtl8188fu-primeos-32bit
          path: |
            rtl8188fu/rtl8188fu.ko
            rtl8188fu/firmware/rtl8188fufw.bin
