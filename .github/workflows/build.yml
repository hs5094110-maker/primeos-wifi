name: Build rtl8188fu for PrimeOS 4.14.15
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev wget xz-utils git gcc-multilib g++-multilib libncurses5-dev
      - name: Download Kernel 4.14.15
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.14.15.tar.xz
          tar -xf linux-4.14.15.tar.xz
      - name: Clone Driver Source
        run: |
          git clone https://github.com/kelebek333/rtl8188fu.git
      - name: Prepare Kernel
        run: |
          cd linux-4.14.15
          sed -i 's/EXTRAVERSION =.*/EXTRAVERSION = -primeos-x86/' Makefile
          make ARCH=i386 defconfig HOSTCFLAGS="-Wno-error -fcommon" HOST_EXTRACFLAGS="-Wno-error -fcommon"
          make ARCH=i386 modules_prepare HOSTCFLAGS="-Wno-error -fcommon" HOST_EXTRACFLAGS="-Wno-error -fcommon"
      - name: Compile Driver
        run: |
          cd rtl8188fu
          make ARCH=i386 KSRC=../linux-4.14.15
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtl8188fu-primeos-32bit
          path: |
            rtl8188fu/rtl8188fu.ko
            rtl8188fu/firmware/rtl8188fufw.bin
