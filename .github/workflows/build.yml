name: Build rtl8188fu ko for PrimeOS
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Driver Source
        uses: actions/checkout@v4
        with:
          repository: kelebek333/rtl8188fu
          ref: master
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev wget xz-utils git gcc-multilib g++-multilib gcc-i686-linux-gnu
      - name: Download Kernel 4.14.15 Source
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.14.15.tar.xz
          tar -xf linux-4.14.15.tar.xz
      - name: Prepare Kernel 4.14.15 for i386
        run: |
          cd linux-4.14.15
          sed -i 's/EXTRAVERSION =.*/EXTRAVERSION = -primeos-x86/' Makefile
          make ARCH=i386 CROSS_COMPILE=i686-linux-gnu- defconfig HOSTCFLAGS="-Wno-error -fcommon" HOST_EXTRACFLAGS="-Wno-error -fcommon"
          make ARCH=i386 CROSS_COMPILE=i686-linux-gnu- modules_prepare HOSTCFLAGS="-Wno-error -fcommon" HOST_EXTRACFLAGS="-Wno-error -fcommon"
      - name: Compile rtl8188fu.ko
        run: |
          make ARCH=i386 CROSS_COMPILE=i686-linux-gnu- KSRC=$PWD/linux-4.14.15
      - name: Verify and Pack
        run: |
          mkdir -p final_output
          cp rtl8188fu.ko final_output/
          cp firmware/rtl8188fufw.bin final_output/
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtl8188fu-primeos-ko
          path: final_output/
