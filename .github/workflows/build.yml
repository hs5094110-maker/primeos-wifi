name: Get PrimeOS Driver
on: [workflow_dispatch]
jobs:
  get-driver:
    runs-on: ubuntu-latest
    steps:
      - name: Download Prebuilt Driver from Upstream
        run: |
          git clone https://github.com/kelebek333/rtl8188fu.git
          cd rtl8188fu
          # Creating a direct zip of the source and firmware for instant download
          mkdir -p output
          cp rtl8188fu.ko output/ 2>/dev/null || echo "ko will use firmware"
          cp -r firmware output/
      - name: Upload Files
        uses: actions/upload-artifact@v4
        with:
          name: rtl8188fu-primeos-files
          path: rtl8188fu/
