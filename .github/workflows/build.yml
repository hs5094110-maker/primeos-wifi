name: Build rtl8188fu PrimeOS
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Driver Source
        uses: actions/checkout@v4
        with:
          repository: kelebek333/rtl8188fu
          ref: master
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic gcc-multilib g++-multilib
      - name: Compile Driver Module
        run: |
          make ARCH=i386 CROSS_COMPILE=i686-linux-gnu-
      - name: Upload Driver & Firmware
        uses: actions/upload-artifact@v4
        with:
          name: rtl8188fu-primeos-32bit
          path: |
            rtl8188fu.ko
            firmware/rtl8188fufw.bin
